<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Style Shop</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
        /* Ylävalikko */
        .navbar { background: #111; padding: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 1000; }
        .nav-btn { background: #222; color: #fff; border: 1px solid #444; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; text-transform: capitalize; transition: 0.3s; text-decoration: none; display: inline-block; }
        .nav-btn:hover, .nav-btn.active { background: #fff; color: #111; font-weight: bold; }
        .home-btn { background: #0056b3; border-color: #004085; }
        /* Otsikko-osio */
        .header-section { text-align: center; padding: 40px 20px; background: #fff; border-bottom: 1px solid #eee; }
        .header-section h1 { margin: 0 0 10px 0; text-transform: capitalize; }
        .ai-status { color: #666; font-style: italic; font-size: 14px; }
        /* Tuoteruudukko */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: #fff; border: 1px solid #e1e1e1; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.06); }
        .product-card img { max-width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; border-radius: 8px; }
        .product-title { font-size: 16px; font-weight: 600; margin: 10px 0; color: #333; height: 44px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }
        .product-price { font-size: 18px; color: #e53238; font-weight: bold; margin: 10px 0; }
        .buy-btn { display: block; background: #0056b3; color: white; padding: 12px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: auto; }
        .buy-btn:hover { background: #004085; }
        .loader { text-align: center; font-size: 18px; padding: 5px; color: #666; width: 100%; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <!-- YLÄVALIKKO KATEGORIOILLA -->
    <nav class="navbar">
        <!-- TÄMÄ VIE TAKAISIN NYKYISELLE ETUSIVULLESI -->
        <a href="index.html" class="nav-btn home-btn">⬅️ Takaisin etusivulle</a>
        
        <button class="nav-btn active" onclick="loadStyle('gangsta style', this)">Gangsta Style</button>
        <button class="nav-btn" onclick="loadStyle('beach style', this)">Beach Style</button>
        <button class="nav-btn" onclick="loadStyle('retro style', this)">Retro Style</button>
        <button class="nav-btn" onclick="loadStyle('mafia style', this)">Mafia Style</button>
        <button class="nav-btn" onclick="loadStyle('hiphop style', this)">Hiphop Style</button>
        <button class="nav-btn" onclick="loadStyle('classic style', this)">Classic Style</button>
        <button class="nav-btn" onclick="loadStyle('office style', this)">Office Style</button>
        <button class="nav-btn" onclick="loadStyle('pirate style', this)">Pirate Style</button>
        <button class="nav-btn" onclick="loadStyle('masc style', this)">Masc Style</button>
        <button class="nav-btn" onclick="loadStyle('femme style', this)">Femme Style</button>
    </nav>

    <div class="header-section">
        <h1 id="current-style-title">Gangsta Style</h1>
        <div id="ai-keywords" class="ai-status">Tekoäly valmistelee tyyliä...</div>
    </div>

    <!-- TUOTTEET LATAUTUVAT TÄHÄN -->
    <div id="products-container" class="product-grid"></div>

    <script>
        function loadStyle(styleName, element) {
            // Päivitetään aktiivinen painike valikossa
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(element && !element.classList.contains('home-btn')) element.classList.add('active');

            // Päivitetään otsikot lataustilaan
            document.getElementById('current-style-title').innerText = styleName;
            document.getElementById('ai-keywords').innerText = "Groq AI stailaa sivua ja hakee eBay-tuotteita...";
            
            const container = document.getElementById('products-container');
            container.innerHTML = '<div class="loader">Etsitään parhaita tyylituotteita tekoälyllä...</div>';

            // Kutsutaan server.js:n tekoälyreittiä
            fetch(`http://localhost:3000/api/ai-style-search?style=${encodeURIComponent(styleName)}`)
                .then(res => res.json())
                .then(data => {
                    container.innerHTML = ''; // Tyhjennetään latausteksti
                    
                    document.getElementById('ai-keywords').innerText = `Tekoälyn valitsemat hakusanat eBaysta: "${data.usedKeywords}"`;

                    if (!data.items || data.items.length === 0) {
                        container.innerHTML = '<div class="loader">Tälle tyylille ei juuri nyt löytynyt tuotteita.</div>';
                        return;
                    }

                    data.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        
                        const imageUrl = item.image ? item.image.imageUrl : 'https://placeholder.com';
                        const affiliateLink = item.itemAffiliateWebUrl || item.itemWebUrl;

                        card.innerHTML = `
                            <div>
                                <img src="${imageUrl}" alt="${item.title}">
                                <div class="product-title" title="${item.title}">${item.title}</div>
                            </div>
                            <div>
                                <div class="product-price">${item.price.value} ${item.price.currency}</div>
                                <a href="${affiliateLink}" target="_blank" class="buy-btn">Osta eBaysta</a>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    container.innerHTML = '<div class="loader">Virhe tuotteiden latauksessa. Varmista, että palvelin on päällä.</div>';
                    console.error(err);
                });
        }

        // Ladataan oletustyyli heti kun sivu avataan ensimmäisen kerran
        window.onload = function() {
            loadStyle('gangsta style', document.querySelector('.nav-btn:not(.home-btn)'));
        };
    </script>
</body>
</html>
